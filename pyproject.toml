[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "template-python"
version = "3.0.9-pre"
description = "A template to get Python projects started quickly"
authors = [{name="Giovanni Pellicciotta", email="giovanni.pellicciotta@gmail.com"}]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.15"
dependencies = [
    "support-python @ git+https://github.com/gpellicciotta/support.python.git@v3.0.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/gpellicciotta/template.python"
Repository = "https://github.com/gpellicciotta/template.python.git"
Changelog = "https://github.com/gpellicciotta/template.python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-timeout>=2.3.0", "ruff>=0.6.0", "build>=1.0.0"]

[project.scripts]
myproject = "myproject.cli:main"

[tool.ruff]
line-length = 132

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: integration tests that run git or subprocesses; run with pytest -m slow"]

