name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.15"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project (editable, with dev extra)
        run: pip install -e ".[dev]"
      - name: Install script requirements (lint-markdown)
        run: pip install -r scripts/requirements.txt
      - name: Lint (ruff)
        run: ruff check . && ruff format --check .
      - name: Lint Markdown (lint-markdown)
        run: lint-markdown check
      - name: Run fast tests
        run: pytest -q
      - name: Run slow tests
        run: pytest -q -m slow --timeout=120
      - name: Build
        run: python -m build
      - name: Archive distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-python-${{ matrix.python-version }}
          path: dist/
