name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure git auth for private support-python dependency
        env:
          SUPPORT_PYTHON_TOKEN: ${{ secrets.SUPPORT_PYTHON_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SUPPORT_PYTHON_TOKEN}@github.com/gpellicciotta/support.python".insteadOf "https://github.com/gpellicciotta/support.python"
      - name: Install project (editable, with dev extra)
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check . && ruff format --check .
      - name: Run tests
        run: pytest -q
      - name: Build
        run: python -m build
      - name: Archive distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-python-${{ matrix.python-version }}
          path: dist/